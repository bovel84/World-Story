name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend unit tests
        run: npm --prefix backend-nest test

      - name: Frontend unit tests
        shell: bash
        run: |
          set -o pipefail
          cd frontend
          ../node_modules/.bin/vitest run --reporter=verbose 2>&1 | tee ../frontend-vitest.log

      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-log
          path: frontend-vitest.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Build backend and frontend
        run: npm run build
