name: Refactor Playback Once

on:
  push:
    branches:
      - refactor/playback-coordinator

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply codemod
        run: python scripts/refactor-playback.py

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build backend and frontend
        run: npm run build

      - name: Commit verified source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-nest/src/game-session.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No codemod changes to commit"
            exit 0
          fi
          git commit -m "refactor(playback): collega coordinatore a GameSession [playback-codemod]"
          git push origin HEAD:refactor/playback-coordinator
